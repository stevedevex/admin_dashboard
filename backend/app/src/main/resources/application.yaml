spring:
  application.name: tao-sandbox
  threads.virtual.enabled: true

server:
  port: 8080

logging.level:
  com.tao.sandbox: INFO

# Swagger over the control panel. Entry points live under the reserved /__tao prefix, like the
# API they document, so a dropped-in customer contract can never shadow them. Only /__tao/** is
# documented — the data plane imitates other people's contracts, which are their own documents.
springdoc:
  api-docs.path: /__tao/openapi
  swagger-ui.path: /__tao/swagger
  paths-to-match: /__tao/**

# ---------------------------------------------------------------------------
# The whole adoption surface: drop in a spec, name the operations you want
# served, declare what identifies a request. Everything else is derived.
# ---------------------------------------------------------------------------
tao.sandbox:
  # ---------------------------------------------------------------------------
  # Payload generation.
  #
  # Off unless `endpoint` is set. There is no offline stand-in: a generator producing
  # schema-shaped placeholder data looks exactly like the feature working, and which one
  # produced a payload is the one thing a reader cannot check by eye. Unconfigured, the
  # dashboard disables the action and says why.
  # ---------------------------------------------------------------------------
  # ai:
  #   endpoint: https://<resource>.openai.azure.com   # setting this is what enables the feature
  #   model: <deployment-name>                        # the deployment, not the base model name
  #   api-version: 2024-10-21                         # pinned: the response shape is parsed here
  #   scope: https://cognitiveservices.azure.com/.default
  #   temperature: 0.4
  #
  #   # How the sandbox proves who it is. Every mode ends at a bearer token for `scope`, so
  #   # nothing downstream knows which was used — the choice is environment, not code.
  #   auth:
  #     # DEFAULT — whatever the environment already offers (a developer's `az login`, environment
  #     #           variables, a managed identity when deployed). Needs no configuration.
  #     # SPN     — an explicit service principal with a secret. For a local or CI run that must
  #     #           not depend on an interactive login.
  #     # UAMI    — a user-assigned managed identity. For a deployment: no secret to hold, leak
  #     #           or rotate. Leave client-id blank to use the system-assigned identity.
  #     mode: DEFAULT
  #
  #     # SPN only:
  #     tenant-id: <directory-id>
  #     client-id: <application-id>
  #     # NEVER write the secret here. A secret committed to a repository is a secret disclosed,
  #     # and rotating it is the only remedy. Supply it from the environment instead:
  #     #     export TAO_SANDBOX_AI_AUTH_CLIENTSECRET=...
  #     # or from a secret store. Prefer UAMI once deployed, which removes the question entirely.
  #     client-secret: ""
  #
  #     # UAMI only — the identity's client id. Blank selects the system-assigned identity.
  #     # client-id: <managed-identity-client-id>

  store: filesystem
  # The mock library ships with the mock-data module; the app is launched from this module's
  # directory. A deployed instance overrides this with its mounted share.
  filesystem.root: ../mock-data/mocks

  scenario:
    active: baseline
    header: X-Sandbox-Scenario

  # The request log is in memory, bounded, and dropped on restart — an observation aid, not a
  # store of record. Defaults shown; raise capacity when capturing a long run.
  requestLog:
    capacity: 500
    maxBodyChars: 32768

  services:
    - id: petstore
      name: Pet Store
      type: REST
      spec: classpath:specs/petstore/petstore.yaml
      basePath: /petstore/v1
      operations:
        # GET with a path variable
        - operationId: showPetById
          keys: [ "path:petId" ]

        # GET with a query parameter; absent means the unfiltered default
        - operationId: listPets
          keys: [ "query:limit" ]
          strategy: FIRST_PRESENT

        # POST with a JSON body
        - operationId: createPets
          keys: [ "body:$.name" ]

    - id: stockquote
      name: Stock Quote
      type: SOAP
      wsdl: classpath:specs/stockquote/stockquote.wsdl
      path: /soap/stockquote
      # XPath 1.0 cannot address a default namespace, so every prefix used below
      # is bound here. soapenv is bound automatically.
      namespaces:
        sq: "http://example.com/stockquote.xsd"
      # Applied to every response from this service unless a mock ships its own .header.xml
      responseHeader: classpath:specs/stockquote/stockquote-response-header.xml
      operations:
        # GetTradeHistory is in the WSDL but not listed, so it answers NOT_IMPLEMENTED
        - operation: GetLastTradePrice
          keys: [ "xpath:/soapenv:Envelope/soapenv:Body/sq:TradePriceRequest/sq:tickerSymbol" ]

    # --- Added by configuration alone, to prove the service extends without code -------------
    # A published third-party spec: OpenAPI 3.1, hyphenated operationIds, two path parameters.
    - id: tictactoe
      name: Tic Tac Toe
      type: REST
      spec: classpath:specs/tictactoe/tictactoe.yaml
      basePath: /tictactoe
      operations:
        - operationId: get-board
          keys: [ "query:none" ]
          strategy: FIRST_PRESENT
        - operationId: get-square
          keys: [ "path:row", "path:column" ]

    # A machine-generated .NET WSDL fetched from a live public endpoint: two SOAP bindings
    # (1.1 and 1.2), an inline schema, and its own target namespace.
    - id: calculator
      name: Calculator
      type: SOAP
      wsdl: classpath:specs/calculator/calculator.wsdl
      path: /soap/calculator
      namespaces:
        calc: "http://tempuri.org/"
      operations:
        - operation: Add
          keys:
            - "xpath:/soapenv:Envelope/soapenv:Body/calc:Add/calc:intA"
            - "xpath:/soapenv:Envelope/soapenv:Body/calc:Add/calc:intB"
        - operation: Divide
          keys:
            - "xpath:/soapenv:Envelope/soapenv:Body/calc:Divide/calc:intA"
            - "xpath:/soapenv:Envelope/soapenv:Body/calc:Divide/calc:intB"

    # A hand-written contract split across two files: the WSDL includes a sibling .xsd rather than
    # declaring its schema inline. See specs/userservice/.
    - id: userservice
      name: User Service
      type: SOAP
      wsdl: classpath:specs/userservice/userservice.wsdl
      path: /soap/userservice
      namespaces:
        us: "http://example.org"
      operations:
        - operation: GetUser
          keys: [ "xpath:/soapenv:Envelope/soapenv:Body/us:GetUserRequest/us:UserId" ]
